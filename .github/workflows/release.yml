name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            windows_sign: true
          - os: macos-latest
            windows_sign: false

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      FISHBATTERY_UPDATER_PUBKEY: ${{ vars.FISHBATTERY_UPDATER_PUBKEY }}
      FISHBATTERY_UPDATER_ENDPOINT_STABLE: ${{ vars.FISHBATTERY_UPDATER_ENDPOINT_STABLE }}
      FISHBATTERY_UPDATER_ENDPOINT_BETA: ${{ vars.FISHBATTERY_UPDATER_ENDPOINT_BETA }}
      TAURI_UPDATER_PUBKEY: ${{ vars.FISHBATTERY_UPDATER_PUBKEY }}
      TAURI_UPDATER_ENDPOINT_STABLE: ${{ vars.FISHBATTERY_UPDATER_ENDPOINT_STABLE }}
      TAURI_UPDATER_ENDPOINT_BETA: ${{ vars.FISHBATTERY_UPDATER_ENDPOINT_BETA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies (Tauri)
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Trusted Signing CLI
        if: matrix.windows_sign
        run: cargo install --locked trusted-signing-cli

      - name: Add Cargo bin to PATH
        if: matrix.windows_sign
        shell: pwsh
        run: |
          "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Stage Trusted Signing CLI for Tauri
        if: matrix.windows_sign
        shell: pwsh
        run: |
          $src = "$env:USERPROFILE\.cargo\bin\trusted-signing-cli.exe"
          Copy-Item $src "$env:GITHUB_WORKSPACE\trusted-signing-cli.exe" -Force
          Copy-Item $src "$env:GITHUB_WORKSPACE\src-tauri\trusted-signing-cli.exe" -Force

      - name: Azure login (Trusted Signing)
        if: matrix.windows_sign
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Windows signing configuration
        if: matrix.windows_sign
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          required=(
            "AZURE_CLIENT_ID"
            "AZURE_CLIENT_SECRET"
            "AZURE_TENANT_ID"
            "AZURE_SUBSCRIPTION_ID"
            "AZURE_TRUSTED_SIGNING_ENDPOINT"
            "AZURE_TRUSTED_SIGNING_ACCOUNT_NAME"
            "AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME"
            "AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"
          )
          missing=0
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              echo "Missing required signing configuration: ${key}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Windows signing is required for release builds."
            exit 1
          fi

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_TRUSTED_SIGNING: ${{ matrix.windows_sign }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_TIMESTAMP_URL: ${{ vars.AZURE_TRUSTED_SIGNING_TIMESTAMP_URL }}
        with:
          tauriScript: npx tauri
          tagName: ${{ github.ref_name }}
          releaseName: Fishbattery Launcher ${{ github.ref_name }}
          releaseBody: See the assets to download this version.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          includeUpdaterJson: true

      - name: Sign Windows release artifacts (post-build)
        if: matrix.windows_sign
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME: ${{ vars.AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/bundle"
          $targets = @()
          $targets += Get-ChildItem (Join-Path $bundleRoot "nsis/*.exe") -ErrorAction SilentlyContinue
          $targets += Get-ChildItem (Join-Path $bundleRoot "msi/*.msi") -ErrorAction SilentlyContinue

          if ($targets.Count -eq 0) {
            throw "No Windows installer artifacts found to sign."
          }

          foreach ($file in $targets) {
            Write-Host "Signing $($file.FullName)"
            trusted-signing-cli `
              --azure-client-secret "$env:AZURE_CLIENT_SECRET" `
              --azure-client-id "$env:AZURE_CLIENT_ID" `
              --azure-tenant-id "$env:AZURE_TENANT_ID" `
              --endpoint "$env:AZURE_TRUSTED_SIGNING_ENDPOINT" `
              --account "$env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" `
              --certificate "$env:AZURE_TRUSTED_SIGNING_CERT_PROFILE_NAME" `
              --description "FishbatteryLauncher" `
              "$($file.FullName)"

            Write-Host "Regenerating updater signature for $($file.FullName)"
            npx tauri signer sign "$($file.FullName)"
          }

          $latest = Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter "latest.json" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $latest) {
            throw "latest.json not found in bundle output."
          }

          $latestJson = Get-Content $latest.FullName -Raw | ConvertFrom-Json
          $exe = Get-ChildItem (Join-Path $bundleRoot "nsis/*.exe") -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi = Get-ChildItem (Join-Path $bundleRoot "msi/*.msi") -ErrorAction SilentlyContinue | Select-Object -First 1
          $exeSig = if ($exe -and (Test-Path "$($exe.FullName).sig")) { (Get-Content "$($exe.FullName).sig" -Raw).Trim() } else { $null }
          $msiSig = if ($msi -and (Test-Path "$($msi.FullName).sig")) { (Get-Content "$($msi.FullName).sig" -Raw).Trim() } else { $null }

          if ($latestJson.platforms.'windows-x86_64-nsis' -and $exeSig) {
            $latestJson.platforms.'windows-x86_64-nsis'.signature = $exeSig
          }
          if ($latestJson.platforms.'windows-x86_64-msi' -and $msiSig) {
            $latestJson.platforms.'windows-x86_64-msi'.signature = $msiSig
          }
          if ($latestJson.platforms.'windows-x86_64') {
            $targetUrl = [string]$latestJson.platforms.'windows-x86_64'.url
            if ($targetUrl -like "*.exe" -and $exeSig) {
              $latestJson.platforms.'windows-x86_64'.signature = $exeSig
            } elseif ($msiSig) {
              $latestJson.platforms.'windows-x86_64'.signature = $msiSig
            }
          }

          $latestJson | ConvertTo-Json -Depth 30 | Set-Content -NoNewline $latest.FullName

      - name: Replace release assets with signed Windows artifacts
        if: matrix.windows_sign
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $bundleRoot = Join-Path $env:GITHUB_WORKSPACE "src-tauri/target/release/bundle"
          $targets = @()
          $targets += Get-ChildItem (Join-Path $bundleRoot "nsis/*.exe") -ErrorAction SilentlyContinue
          $targets += Get-ChildItem (Join-Path $bundleRoot "msi/*.msi") -ErrorAction SilentlyContinue
          $targets += Get-ChildItem (Join-Path $bundleRoot "nsis/*.exe.sig") -ErrorAction SilentlyContinue
          $targets += Get-ChildItem (Join-Path $bundleRoot "msi/*.msi.sig") -ErrorAction SilentlyContinue
          $targets += Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter "latest.json" -ErrorAction SilentlyContinue

          foreach ($file in $targets) {
            Write-Host "Uploading signed asset $($file.Name) to release $tag"
            gh release upload $tag "$($file.FullName)" --clobber
          }
