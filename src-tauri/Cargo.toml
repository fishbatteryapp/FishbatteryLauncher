[package]
name = "fishbattery-launcher"
version = "0.6.3"
description = "A fast, underwater-themed Minecraft launcher focused on clean UX, modded play, and reliable cross-device updates."
authors = ["Fishbattery"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
flate2 = "1"
futures-util = "0.3"
http-body = "1"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tauri = { version = "2.10", features = [] }
tauri-plugin-updater = "2.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
urlencoding = "2"
webbrowser = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
