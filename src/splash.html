<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starting Fishbattery Launcher</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #071018;
        --panel: rgba(11, 18, 28, 0.95);
        --border: rgba(136, 194, 234, 0.16);
        --text: #edf5ff;
        --muted: #90a7bf;
        --accent-a: #3ddc84;
        --accent-b: #34c8ff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        font-family: "Segoe UI", system-ui, sans-serif;
        border-radius: 0;
      }

      body {
        display: grid;
        place-items: center;
      }

      .splash-shell {
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: rgba(10, 15, 22, 0.96);
      }

      .splash-card {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 28px 30px;
      }

      .logo {
        width: 120px;
        height: 120px;
        margin-bottom: 20px;
        display: grid;
        place-items: center;
      }

      .logo img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.28));
        animation: logo-spin 2.8s linear infinite;
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(171, 199, 223, 0.76);
      }

      h1 {
        margin: 12px 0 8px;
        font-size: 29px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        color: var(--text);
      }

      p {
        margin: 0;
        max-width: 250px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .progress {
        position: relative;
        width: 100%;
        height: 8px;
        margin-top: 24px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.08);
      }

      .progress span {
        display: block;
        width: 38%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, rgba(61, 220, 132, 0.9), rgba(52, 200, 255, 0.88));
        box-shadow: 0 0 24px rgba(52, 200, 255, 0.28);
        animation: progress-sweep 1.5s ease-in-out infinite;
      }

      @keyframes logo-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes progress-sweep {
        0% { transform: translateX(-105%) scaleX(0.78); }
        55% { transform: translateX(150%) scaleX(1); }
        100% { transform: translateX(170%) scaleX(0.82); }
      }
    </style>
  </head>
  <body>
    <div class="splash-shell">
      <div class="splash-card">
        <div class="logo" aria-hidden="true">
          <img src="/startup-logo.png" alt="" />
        </div>
        <div class="eyebrow">Fishbattery Launcher</div>
        <h1>Starting up</h1>
        <p>Preparing your library, services, and account state...</p>
        <div class="progress" aria-hidden="true"><span></span></div>
      </div>
    </div>
  </body>
</html>
